<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="titre desc">
<title id="titre">Avatar Pilotia</title>
<desc id="desc">Illustration d'un conseiller souriant, en costume bleu marine, chemise blanche et cravate bleue, sur fond bleu clair cerclé de bronze.</desc>

<!-- ===================================================================
     AVATAR PILOTIA — portrait rond

     Style : proportions cartoon (tête volontairement grosse, cou très
     court), cheveux courts avec du volume sur le dessus, tempes
     dégagées et barbe courte fournie.

     Palette alignée sur style.css :
       marine   #1B2A41   veste
       bleu     #0369A1   cravate
       bronze   #876231   anneau

     PERSONNALISATION — tout se règle dans le bloc « style » ci-dessous :
       « peau »        teint
       « peau-ombre »  ombre du cou et du nez, un cran plus sombre
       « cheveux »     cheveux et barbe
     Pour RETIRER LA BARBE : effacer le groupe « barbe ».
     =================================================================== -->
<style>
  :root, svg {
    --peau:        #D0A075;
    --peau-ombre:  #B3835A;
    --cheveux:     #1B1410;
    --marine:      #1B2A41;
    --marine-fonce:#132033;
    --bleu:        #0369A1;
    --bronze:      #876231;
    --chemise:     #FFFFFF;
    --fond:        #DCE9F2;
    --trait:       #0F172A;
  }
</style>

<!-- ·········· Fond ·········· -->
<circle cx="200" cy="200" r="196" fill="var(--fond)"/>
<circle cx="200" cy="200" r="190" fill="none" stroke="var(--bronze)" stroke-width="5"/>

<clipPath id="disque"><circle cx="200" cy="200" r="187.5"/></clipPath>
<g clip-path="url(#disque)">

  <!-- ·········· Buste ·········· -->
  <!-- Cou très court, presque entièrement masqué par le col : c'est ce qui
       donne la silhouette cartoon plutôt qu'un portrait réaliste. -->
  <path d="M 178 232 L 178 300 L 222 300 L 222 232 Z" fill="var(--peau)"/>
  <path d="M 178 232 L 178 254 C 192 270 208 270 222 254 L 222 232 Z" fill="var(--peau-ombre)"/>

  <!-- Veste -->
  <path d="M 200 264
           C 158 264 112 278 86 306
           C 60 334 48 392 42 420
           L 358 420
           C 352 392 340 334 314 306
           C 288 278 242 264 200 264 Z"
        fill="var(--marine)"/>

  <!-- Chemise : triangle inversé entre les revers. -->
  <path d="M 176 262 L 200 344 L 224 262 Z" fill="var(--chemise)"/>
  <!-- Revers, angles hauts en retrait de la ligne d'épaule. -->
  <path d="M 176 262 L 200 344 L 156 302 L 152 278 Z" fill="var(--marine-fonce)"/>
  <path d="M 224 262 L 200 344 L 244 302 L 248 278 Z" fill="var(--marine-fonce)"/>

  <!-- Cravate : le nœud puis le pan, en bleu accent. -->
  <path d="M 190 264 L 210 264 L 215 284 L 200 296 L 185 284 Z" fill="var(--bleu)"/>
  <path d="M 189 296 L 211 296 L 216 372 L 200 392 L 184 372 Z" fill="var(--bleu)"/>

  <!-- ·········· Tête ·········· -->
  <ellipse cx="116" cy="166" rx="14" ry="21" fill="var(--peau)"/>
  <ellipse cx="284" cy="166" rx="14" ry="21" fill="var(--peau)"/>

  <path d="M 200 62
           C 248 62 284 94 284 150
           C 284 198 266 234 238 246
           C 224 253 176 253 162 246
           C 134 234 116 198 116 150
           C 116 94 152 62 200 62 Z"
        fill="var(--peau)"/>

  <!-- BARBE — courte, dessine la mâchoire sans manger le visage. -->
  <g id="barbe">
    <!-- Barbe resserrée : trop large, elle dévorait les joues et assombrissait
         tout le bas du visage. -->
    <path d="M 128 178
             C 128 210 142 236 164 246
             C 178 253 222 253 236 246
             C 258 236 272 210 272 178
             C 268 198 260 208 254 214
             C 246 222 242 234 234 240
             C 223 247 177 247 166 240
             C 158 234 154 222 146 214
             C 140 208 132 198 128 178 Z"
          fill="var(--cheveux)" opacity=".88"/>
    <path d="M 178 206 C 188 200 212 200 222 206 C 212 204 188 204 178 206 Z" fill="var(--peau)"/>
  </g>

  <!-- CHEVEUX — du volume sur le dessus et une naissance haute : sans front
       dégagé, la coiffure fait casque et mange le visage. -->
  <path d="M 116 150
           C 104 88 132 32 198 36
           C 242 38 274 62 283 98
           C 287 114 286 134 284 150
           C 278 124 268 108 256 100
           C 244 92 232 100 216 94
           C 196 86 166 90 148 102
           C 134 111 122 128 116 150 Z"
        fill="var(--cheveux)"/>

  <!-- ·········· Visage ·········· -->
  <!-- Sourcils épais et bien séparés des yeux. -->
  <path d="M 150 128 C 159 119 181 119 190 126" fill="none" stroke="var(--cheveux)"
        stroke-width="8" stroke-linecap="round"/>
  <path d="M 250 128 C 241 119 219 119 210 126" fill="none" stroke="var(--cheveux)"
        stroke-width="8" stroke-linecap="round"/>

  <!-- Yeux -->
  <ellipse cx="168" cy="166" rx="9" ry="10" fill="var(--trait)"/>
  <ellipse cx="232" cy="166" rx="9" ry="10" fill="var(--trait)"/>
  <circle cx="171" cy="163" r="2.8" fill="#FFFFFF"/>
  <circle cx="235" cy="163" r="2.8" fill="#FFFFFF"/>

  <!-- Nez -->
  <path d="M 201 180 L 201 194 C 201 198 206 200 210 198" fill="none"
        stroke="var(--peau-ombre)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sourire ouvert -->
  <path d="M 174 208 C 187 206 213 206 226 208
           C 224 228 213 237 200 237
           C 187 237 176 228 174 208 Z" fill="#5C2E2E"/>
  <path d="M 177 209 C 189 207 211 207 223 209
           C 222 216 214 219 200 219
           C 186 219 178 216 177 209 Z" fill="#FFFFFF"/>
</g>
</svg>
