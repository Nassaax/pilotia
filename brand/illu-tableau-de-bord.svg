<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="illu-dash-titre illu-dash-desc">
<title id="illu-dash-titre">Tableau de bord de gestion</title>
<desc id="illu-dash-desc">Illustration d'un tableau de bord : trois indicateurs clés, une courbe d'évolution orientée à la hausse et un graphique en anneau répartissant l'activité en trois parts.</desc>

<!-- ===================================================================
     ILLUSTRATION « TABLEAU DE BORD » — Pilotia

     DOUBLE USAGE. Chaque couleur est écrite `var(«jeton», repli)` :
       · insérée telle quelle dans une page du site, elle prend les jetons
         de style.css et suit donc le thème clair/sombre automatiquement ;
       · ouverte seule (Canva, réseaux sociaux), aucun jeton n'existe et
         c'est la valeur de repli qui s'applique.
     C'est ce qui évite de maintenir deux fichiers séparés.

     Les chiffres sont volontairement muets : barres grises à la place des
     libellés. Une illustration ne doit pas inventer de données.
     =================================================================== -->

<!-- ·········· Carte ·········· -->
<rect x="40" y="30" width="560" height="360" rx="18"
      fill="var(--card, #FFFFFF)" stroke="var(--line, #E2E8F0)" stroke-width="2"/>

<!-- ·········· Trois indicateurs ·········· -->
<!-- Chaque tuile : un aplat de fond, une « valeur » épaisse, un « libellé » fin. -->
<g>
  <rect x="64"  y="54" width="160" height="64" rx="11" fill="var(--accent-soft, #E1EEF6)"/>
  <rect x="80"  y="70" width="64"  height="15" rx="5"  fill="var(--accent, #0369A1)"/>
  <rect x="80"  y="93" width="104" height="8"  rx="4"  fill="var(--ink-soft, #475569)" opacity=".45"/>

  <rect x="240" y="54" width="160" height="64" rx="11" fill="var(--gold-soft, #F3E9DA)"/>
  <rect x="256" y="70" width="52"  height="15" rx="5"  fill="var(--gold, #876231)"/>
  <rect x="256" y="93" width="92"  height="8"  rx="4"  fill="var(--ink-soft, #475569)" opacity=".45"/>

  <rect x="416" y="54" width="160" height="64" rx="11" fill="var(--accent-soft, #E1EEF6)"/>
  <rect x="432" y="70" width="72"  height="15" rx="5"  fill="var(--accent, #0369A1)"/>
  <rect x="432" y="93" width="84"  height="8"  rx="4"  fill="var(--ink-soft, #475569)" opacity=".45"/>
</g>

<!-- ·········· Courbe d'évolution ·········· -->
<g>
  <!-- Lignes de repère horizontales. -->
  <g stroke="var(--line, #E2E8F0)" stroke-width="1.5">
    <line x1="64" y1="150" x2="376" y2="150"/>
    <line x1="64" y1="198" x2="376" y2="198"/>
    <line x1="64" y1="246" x2="376" y2="246"/>
    <line x1="64" y1="294" x2="376" y2="294"/>
  </g>
  <!-- Axe des abscisses, plus marqué que les repères. -->
  <line x1="64" y1="340" x2="376" y2="340" stroke="var(--line, #E2E8F0)" stroke-width="2.5"/>

  <!-- Aire sous la courbe : c'est elle qui donne du poids à la tendance. -->
  <path d="M 64 292 L 116 268 L 168 279 L 220 236 L 272 222 L 324 230 L 376 178
           L 376 340 L 64 340 Z"
        fill="var(--accent, #0369A1)" opacity=".13"/>
  <!-- La courbe : montante, mais avec des creux — une droite ferait faux. -->
  <path d="M 64 292 L 116 268 L 168 279 L 220 236 L 272 222 L 324 230 L 376 178"
        fill="none" stroke="var(--accent, #0369A1)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Points de mesure. -->
  <g fill="var(--card, #FFFFFF)" stroke="var(--accent, #0369A1)" stroke-width="3">
    <circle cx="64"  cy="292" r="4.5"/>
    <circle cx="116" cy="268" r="4.5"/>
    <circle cx="168" cy="279" r="4.5"/>
    <circle cx="220" cy="236" r="4.5"/>
    <circle cx="272" cy="222" r="4.5"/>
    <circle cx="324" cy="230" r="4.5"/>
  </g>
  <!-- Dernier point accentué en bronze : le regard doit finir sur la hausse. -->
  <circle cx="376" cy="178" r="8" fill="var(--gold, #876231)"/>
  <circle cx="376" cy="178" r="14" fill="var(--gold, #876231)" opacity=".2"/>
</g>

<!-- ·········· Anneau de répartition ·········· -->
<!-- Trois parts tracées en pointillé de contour plutôt qu'en arcs calculés :
     circonférence = 2·π·50 = 314,16 ; les parts valent 45 %, 33 % et 22 %,
     soit 141,37 + 103,67 + 69,12. Le rotate(-90) fait démarrer à midi. -->
<g transform="rotate(-90 488 235)" fill="none" stroke-width="26">
  <circle cx="488" cy="235" r="50" stroke="var(--accent, #0369A1)"
          stroke-dasharray="141.37 172.79"/>
  <circle cx="488" cy="235" r="50" stroke="var(--gold, #876231)"
          stroke-dasharray="103.67 210.49" stroke-dashoffset="-141.37"/>
  <circle cx="488" cy="235" r="50" stroke="var(--ink-soft, #475569)" opacity=".35"
          stroke-dasharray="69.12 245.04" stroke-dashoffset="-245.04"/>
</g>

<!-- Légende de l'anneau. -->
<g>
  <circle cx="424" cy="322" r="6" fill="var(--accent, #0369A1)"/>
  <rect x="440" y="317" width="96" height="9" rx="4.5" fill="var(--ink-soft, #475569)" opacity=".45"/>

  <circle cx="424" cy="346" r="6" fill="var(--gold, #876231)"/>
  <rect x="440" y="341" width="72" height="9" rx="4.5" fill="var(--ink-soft, #475569)" opacity=".45"/>

  <circle cx="424" cy="370" r="6" fill="var(--ink-soft, #475569)" opacity=".35"/>
  <rect x="440" y="365" width="84" height="9" rx="4.5" fill="var(--ink-soft, #475569)" opacity=".45"/>
</g>
</svg>
